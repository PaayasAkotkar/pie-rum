syntax = "proto3";

package rumrpc;
option go_package = "app/main/rumrpc";

message ISequence {
  string profile = 1;
  // string service = 2;
  // int32 rank = 3;
  bytes input = 4;
}

message IPost {
  ISequence profile = 1;
  bool      push    = 3;
};

message IPackageRequest{
  string profile    = 1;
  string kit        = 2;
  string service    = 3;
  string dispatcher = 4;
  string event      = 5;
}

message IPackage {
  string          error   = 1;
  IPackageRequest name    = 2;
  ISucceed        succeed = 3;
  bytes           package = 4;
}

message ISucceed {
  bool succeed = 1;
}

message IPostRequest { repeated IPost post = 1; };

message IPostResponse {  ISucceed succeed =  1; };

message IMonitorTagRequest{
  repeated string tag = 1;
}

message IMonitorTagResponse{
  ISucceed succeed = 1;
}

message ReleaseRequest{
  bool release = 1;
}

message ReleaseResponse{
  ISucceed succeed = 1;
}


message IConfig{
  bool activate =1;
  ISwap swap =2;
}

message ISwap{
  string with=1;
  string current=2;
  bool swap=3;
}

message IConfigResponse{
  string error=1;
  bool succeed=2;
}

message IDocRequest{

}

message IDocResponse{
  string doc=1;
  bool succeed=2;
  string error=3;
}

message IConfigRequest{
  IConfig config=1;
  string profileName=2;
  string kitName=3;
  string serviceName=4;
  string dispatcherName=5;
  string eventName=6;
}

///
// OnRumService provides control plane services
// activate:- only if present & is deactive
// deactivate:- only if present & is active
// swap:- only if present & is active
service OnRumService {

  //  posts the user request
  rpc POST(IPostRequest) returns (IPostResponse);

  // monitor tag appends the tag if not found
  rpc MonitorTag(IMonitorTagRequest) returns (IMonitorTagResponse);

// release basically empties the cache
  rpc Release(ReleaseRequest) returns (ReleaseResponse);

// configurations --------

rpc UpdateProfileConfig(IConfigRequest) returns (IConfigResponse);
rpc UpdateKitConfig(IConfigRequest) returns (IConfigResponse);
rpc UpdateServiceConfig(IConfigRequest) returns (IConfigResponse);
rpc UpdateDispatcherConfig(IConfigRequest) returns (IConfigResponse);
rpc UpdateEventConfig(IConfigRequest) returns (IConfigResponse);

rpc GetDoc(IDocRequest) returns (IDocResponse);

 
}



